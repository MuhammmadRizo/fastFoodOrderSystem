<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.gstatic.com">
	<link rel="shortcut icon" href="./img/favicon.svg" type="image/x-icon">
	<link
		href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Lobster&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="./css/main.css">
	<title>LOOK ORDER | BY MUHAMMAD RIZO</title>
</head>

<body>
	<div class="container">
		<div class="navbar">
			<div class="navbar-top">
				<a href="#">
					<img src="./img/logo.svg" alt="logo" height="50">
				</a>
			</div>
			<div class="navbar-main">
				<ul class="customers-list">
					<!-- Barcha ro'yhatdan o'tgan userlar -->
				</ul>
			</div>
			<div class="navbar-footer">
				<form id="userAdd">
					<input id="usernameInput" type="text" placeholder="username..." required>
					<input id="telephoneInput" type="tel" placeholder="telephone..." required>
					<button type="submit">
						<img src="https://img.icons8.com/pastel-glyph/64/000000/add-user-male--v2.png" alt="plus-icon">
					</button>
				</form>
			</div>
		</div>
		<div class="main">
			<div class="main-headers">
				<div class="cutomer-id-wrapper">
					<span>client id:</span>
					<span id="clientId">1</span>
					<!-- Bu yerda tanlanganda userId almashishi uchun ishlatishimiz kerak -->
				</div>
				<h1 id="userHeader" class="customer-name">Sobir</h1>
				<!-- Bu yerda tanlanganda userName almashishi uchun ishlatishimiz kerak -->
			</div>
			<div class="main-orders">
				<ul class="orders-list">
					<!-- Barcha user buyurtmalari -->
				</ul>
			</div>
			<div class="main-footer">
				<form id="foodsForm">
					<select id="foodsSelect">
						<!-- Barcha food chiqish joyi -->
					</select>
					<input id="foodsCount" type="number" placeholder="count" required>
					<button type="submit">
						<img src="https://img.icons8.com/plasticine/100/000000/plus-math.png" alt="plus-button"
							height="35">
					</button>
				</form>
			</div>
		</div>
	</div>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.min.js"
		integrity="sha512-OVq+Gfa9PIjbTC0jWOccSFSp/vzkBQ5pMcbHQrNZLl+izmdFmusmAMlX4LT550ivvSnMXMEeG7CxEtjIz6Dn2Q=="
		crossorigin="anonymous" referrerpolicy="no-referrer"></script>
	<script src="./js/look.js"></script>
</body>

</html>
